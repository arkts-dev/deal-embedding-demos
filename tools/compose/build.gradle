plugins { id 'base' }
repositories {
    google { metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() } }
    mavenCentral { metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() } }
}
configurations { androidRuntime }
configurations.androidRuntime.resolutionStrategy.eachDependency { details ->
    def group = details.requested.group
    def name = details.requested.name
    if (group.startsWith('androidx.compose') && !name.endsWith('-android') && !name.contains('annotation')) {
        details.useTarget "${group}:${name}-android:${details.requested.version}"
    }
    if (group == 'androidx.lifecycle' && name in ['lifecycle-runtime','lifecycle-runtime-compose','lifecycle-viewmodel','lifecycle-viewmodel-compose','lifecycle-viewmodel-savedstate']) details.useTarget "${group}:${name}-android:2.9.4"
    if (group == 'androidx.savedstate' && name in ['savedstate','savedstate-compose']) details.useTarget "${group}:${name}-android:${details.requested.version}"
    if (group == 'androidx.lifecycle' && name == 'lifecycle-common') details.useTarget "${group}:${name}-jvm:${details.requested.version}"
    if (group == 'androidx.collection' && name == 'collection') details.useTarget "${group}:collection-jvm:${details.requested.version}"
    if (group == 'androidx.annotation' && name == 'annotation') details.useTarget "${group}:annotation-jvm:${details.requested.version}"
}
dependencies {
    androidRuntime 'androidx.compose.material3:material3-android:1.5.0-alpha06'
    androidRuntime 'androidx.compose.foundation:foundation-android:1.9.3'
    androidRuntime 'androidx.compose.ui:ui-android:1.9.3'
    androidRuntime 'androidx.activity:activity-compose:1.11.0'
}
tasks.register('copyRuntime', Copy) {
    from { configurations.androidRuntime.incoming.artifactView { lenient = true }.files }
    into '../../build/compose/dependencies'
    doFirst {
        def failures = configurations.androidRuntime.incoming.artifactView { lenient = true }.artifacts.failures
        failures.each { failure ->
            if (!(failure.message.contains('lifecycle-runtime-2.9.4.aar') || failure.message.contains('savedstate-1.3.3.aar'))) throw failure
        }
    }
    doLast {
        // These published POMs name an unqualified artifact; Maven serves the qualified Android name.
        [['androidx/lifecycle','lifecycle-runtime-android','2.9.4'], ['androidx/savedstate','savedstate-android','1.3.3']].each { item ->
            def name = "${item[1]}-${item[2]}.aar"
            def target = file("../../build/compose/dependencies/$name")
            new URL("https://dl.google.com/dl/android/maven2/${item[0]}/${item[1]}/${item[2]}/$name").withInputStream { input -> target.withOutputStream { it << input } }
        }
    }
}
